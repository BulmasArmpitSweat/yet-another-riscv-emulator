[package]
name = "yet-another-riscv-emulator"
version = "0.1.0"
edition = "2024"
description = "An attempt at making an emulator for a RISC-V CPU. In Rust, of course. What else did you expect me to write it in?"
readme = "README.md"
repository = "https://github.com/BulmasArmpitSweat/yet-another-riscv-emulator.git"
authors = [ "Joel Hills" ]
license = "GPL-3.0-only"

[dependencies]
arrayvec = { version = "0.7.8", default-features = false }
bitfields = "3.2.1"
enable_elements = { path = "enable_elements" }
thiserror = { version = "2.0.21", default-features = false }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Disallow unwrap and expect calls
unwrap_used = "deny"
expect_used = "deny"
# disallow code that unconditionally panics (execpt for panic itself)
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
